<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script type="module">
    import { Huerific } from "./index.js"

    const instance = new Huerific({
      context: 6,
      offset: 7,
      hueShift: 0.64,
      autoSaturate: 2.66,
    });

    const colors = {
      blue: [213, 94, 56],
      brown: [33, 27, 50],
      cyan: [188, 86, 53],
      lime: [82, 84, 67],
      green: [142, 70, 45],
      indigo: [235, 84, 67],
      violet: [239, 84, 67],
      orange: [37, 100, 52],
      purple: [271, 81, 56],
      pink: [329, 86, 70],
      red: [4, 72, 51],
      magenta: [341, 100, 55],
      teal: [172, 66, 50],
      yellow: [42, 95, 56],
    };

    const render = (props) =>
    {
      if (props.levels) {
        instance.levels = props.levels
      }

      const fragment = document.createDocumentFragment()

      for (let i = 0; i < props.colors; i++) {
        const hue = props.hue + (((360 / props.colors) * i))

        const chart = instance.generate(hue, props.saturation, props.lightness)
        const subfragment = document.createElement('div')
        subfragment.classList.add('row');

        chart.forEach(([h, s, l]) =>
        {
          const div = document.createElement('div')
          div.classList.add('swatch');
          div.style.backgroundColor = `hsl(${h}, ${s}%, ${l}%)`;

          subfragment.appendChild(div);
        })

        fragment.appendChild(subfragment);
      }


      const grid = document.querySelector('.grid')

      if (grid) {
        grid.innerHTML = '';
        grid.appendChild(fragment)
      }

    }

    window.addEventListener('DOMContentLoaded', () =>
    {
      const options = {
        colors: 14,
        hue: 4,
        saturation: 46,
        lightness: 18,
        levels: 8,
      }

      Object.entries(options).forEach(([key, value]) =>
      {
        const target = document.querySelector(`input[name="${key}"]`)
        target.value = options[key]
        target && target.addEventListener('change', (event) =>
        {
          options[key] = parseFloat(event.target.value) || 0

          render(options)
        });
      });



      const darkmode = document.querySelector('input[name="darkmode"]')
      darkmode.checked = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? true : false
      darkmode && darkmode.addEventListener('change', (event) =>
      {
        document.body.classList.toggle('darkmode')
      })

      if (darkmode.checked) {
        document.body.classList.add('darkmode')
      }

      render(options)
    });
  </script>
  <style>
    .wrapper {
      display: flex;
      padding: 100px 20px;
      margin: 0 auto;
      width: 700px;
    }

    body {
      font-family: sans-serif;
    }

    body.darkmode {
      background-color: #000;
      color: #6f6f6f;
    }

    h2 {
      letter-spacing: -0.07em;
      font-size: 2rem;
      margin-bottom: 0.2em;
    }

    .controls,
    .grid {
      margin: 0 auto;
    }

    .row {
      display: flex;
      flex-shrink: 0;
      gap: 4px;
    }

    .grid {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      flex-shrink: 0;
      flex-direction: column;
      justify-content: stretch;
      gap: 10px;
      padding: 24px;
    }

    label {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    label input:not([type=checkbox]) {
      width: 80px;
      margin-left: auto;
      padding: 4px 8px;
      background-color: transparent;
      color: currentColor;
      border: solid currentColor 1px;
    }

    .swatch {
      display: block;
      width: 20px;
      border-radius: 20px;
      height: 20px;
      color: transparent;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="controls">
      <h2>Heurific</h2>
      <label>
        Hue
        <input name="hue" type="number" min="0" max="360" />
      </label>
      <label>
        Saturation
        <input name="saturation" type="number" min="0" max="100" />
      </label>
      <label>
        lightness
        <input name="lightness" type="number" min="0" max="100" />
      </label>
      <label>
        Colors
        <input name="colors" type="number" min="0" max="360" />
      </label>
      <label>
        Levels
        <input name="levels" type="number" min="0" max="24" />
      </label>
      <label>
        Darkmode
        <input type="checkbox" name="darkmode" />
      </label>
    </div>
    <div class="grid"></div>
  </div>
</body>

</html>
